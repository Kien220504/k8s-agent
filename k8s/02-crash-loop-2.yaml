apiVersion: v1
kind: Pod
metadata:
  name: crash-loop-2
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ -z "$DATABASE_URL" ]; then
            echo "Initializing... ERROR: Missing parameter DATABASE_URL"
            exit 1
          fi
          echo "Connected"
          sleep 3600